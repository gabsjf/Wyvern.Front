<div class="auth-container">
  <div class="glass-panel auth-card animate-fade-in">
    <div class="auth-header">
      <h1 class="title-glow">Confirmar e-mail</h1>
    </div>

    <p *ngIf="estado === 'confirmando'" class="text-secondary" style="text-align: center">Confirmando...</p>

    <ng-container *ngIf="estado === 'ok'">
      <div class="alert-ok" role="status"><p>E-mail confirmado! Sua conta está ativa.</p></div>
      <a [routerLink]="['/login']" class="btn-primary auth-submit" style="display: block; text-align: center">Entrar</a>
    </ng-container>

    <ng-container *ngIf="estado === 'erro'">
      <div class="alert-error">{{ errorMessage }}</div>
      <div class="auth-footer">
        <p>Link vencido? <a [routerLink]="['/register']" class="text-accent">Cadastre-se de novo</a> para receber outro.</p>
      </div>
    </ng-container>
  </div>
</div>
