<app-auth-shell>
  <h1 class="auth-titulo">Junte-se à guilda</h1>
  <p class="auth-sub">Crie sua conta para começar.</p>

  <div *ngIf="errorMessage" class="alert-error" role="alert">{{ errorMessage }}</div>

  <div *ngIf="mensagemEnviado" class="alert-ok" role="status">
    <p>{{ mensagemEnviado }}</p>
    <p>Depois de confirmar, <a [routerLink]="['/login']" [queryParams]="{ returnUrl: returnUrl }">entre na sua conta</a>.</p>
  </div>

  <form *ngIf="!mensagemEnviado" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label class="form-label" for="nome">Nome ou apelido</label>
      <input id="nome" type="text" class="form-control" formControlName="nome" placeholder="Seu nome" autocomplete="name">
      <div *ngIf="registerForm.get('nome')?.invalid && registerForm.get('nome')?.touched" class="text-error">Nome é obrigatório.</div>
    </div>

    <div class="form-group">
      <label class="form-label" for="email">E-mail</label>
      <input id="email" type="email" class="form-control" formControlName="email" placeholder="exemplo@email.com" autocomplete="email">
      <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" class="text-error">E-mail inválido.</div>
    </div>

    <div class="form-group">
      <label class="form-label" for="senha">Senha</label>
      <input id="senha" type="password" class="form-control" formControlName="senha" placeholder="Mínimo de 6 caracteres" autocomplete="new-password">
      <div *ngIf="registerForm.get('senha')?.invalid && registerForm.get('senha')?.touched" class="text-error">A senha deve ter pelo menos 6 caracteres.</div>
    </div>

    <button type="submit" class="btn-primary auth-submit" [disabled]="registerForm.invalid || loading">
      <span *ngIf="!loading">Criar conta</span>
      <span *ngIf="loading">Registrando...</span>
    </button>
  </form>

  <div class="auth-footer">
    <p>Já tem uma conta? <a [routerLink]="['/login']" [queryParams]="{ returnUrl: returnUrl }">Faça login aqui</a></p>
  </div>
</app-auth-shell>
