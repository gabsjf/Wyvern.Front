<app-auth-shell>
  <ng-container *ngIf="estado === 'confirmando'">
    <div class="auth-selo carregando" aria-hidden="true"></div>
    <h1 class="auth-titulo">Confirmando</h1>
    <p class="auth-sub" role="status">Só um instante, estamos validando seu e-mail...</p>
  </ng-container>

  <ng-container *ngIf="estado === 'ok'">
    <div class="auth-selo ok" aria-hidden="true">&#10003;</div>
    <h1 class="auth-titulo">E-mail confirmado</h1>
    <p class="auth-sub" role="status">Sua conta está ativa. Já pode entrar e começar a aventura.</p>
    <a [routerLink]="['/login']" class="btn-primary auth-submit">Entrar</a>
  </ng-container>

  <ng-container *ngIf="estado === 'erro'">
    <div class="auth-selo erro" aria-hidden="true">!</div>
    <h1 class="auth-titulo">Não deu certo</h1>
    <div class="alert-error" role="alert">{{ errorMessage }}</div>
    <div class="auth-footer">
      <p>Link vencido? <a [routerLink]="['/register']">Cadastre-se de novo</a> para receber outro.</p>
    </div>
  </ng-container>
</app-auth-shell>
