@if (sessao) {
  <div class="container play-session animate-fade-in">
    <header class="page-head">
      <div>
        <p class="eyebrow">Modo jogar · Sessão {{ sessao.numeroSessao }}</p>
        <h1>{{ sessao.nome }}</h1>
        <p class="sub">{{ sessao.campanha?.nome || 'Campanha' }}</p>
      </div>
    </header>

    <div class="top-nav-tabs" role="tablist" aria-label="Ferramentas da sessão">
      <button type="button" role="tab" class="tab-btn" id="aba-combate" aria-controls="painel-sessao"
              [class.active]="activeTab === 'combate'" [attr.aria-selected]="activeTab === 'combate'"
              (click)="setTab('combate')">Combate</button>
      <button type="button" role="tab" class="tab-btn" id="aba-anotacoes" aria-controls="painel-sessao"
              [class.active]="activeTab === 'anotacoes'" [attr.aria-selected]="activeTab === 'anotacoes'"
              (click)="setTab('anotacoes')">Anotações</button>
    </div>

    <div class="content-panel" id="painel-sessao" role="tabpanel"
         [attr.aria-labelledby]="activeTab === 'combate' ? 'aba-combate' : 'aba-anotacoes'">
      @if (activeTab === 'combate') {
        <app-combate-tracker [sessaoId]="sessaoId" [campanhaId]="sessao.campanhaId"></app-combate-tracker>
      } @else {
        <app-anotacoes [campanhaId]="sessao.campanhaId"></app-anotacoes>
      }
    </div>
  </div>
} @else {
  <div class="container">
    <p class="text-muted" role="status">Carregando a sessão...</p>
  </div>
}
