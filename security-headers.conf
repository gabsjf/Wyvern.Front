# Começa em Report-Only (só registra violações no console); depois de navegar pelo app sem avisos, troque por
# Content-Security-Policy. Mantenha em sincronia com o Caddyfile e o <meta> do index.html. O HSTS fica no Caddy (HTTPS).
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' https://fonts.googleapis.com https://cdn.jsdelivr.net; style-src-attr 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' blob: data: https://api.wyvern.sbs; connect-src 'self' https://api.wyvern.sbs wss://api.wyvern.sbs; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
