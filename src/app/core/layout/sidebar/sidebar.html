<!-- Celular: barra de topo com marca, tema e sair -->
<header class="mobile-bar">
  <a class="brand" routerLink="/dashboard" aria-label="Wyvern, ir para o painel">Wyvern</a>
  <div class="mobile-actions">
    <a class="icon-btn perfil-mobile" routerLink="/perfil" routerLinkActive="active" ariaCurrentWhenActive="page" aria-label="Meu perfil">
      <app-avatar [nome]="usuario()?.nome ?? ''" [versao]="usuario()?.fotoVersao ?? 0" [tamanho]="32" />
    </a>
    <button type="button" class="icon-btn" (click)="alternarTema()"
            [attr.aria-label]="temaAtual === 'escuro' ? 'Mudar para o tema claro' : 'Mudar para o tema escuro'">
      <i class="bi" [class.bi-sun]="temaAtual === 'escuro'" [class.bi-moon-stars]="temaAtual === 'claro'" aria-hidden="true"></i>
    </button>
    <button type="button" class="icon-btn" (click)="logout()" aria-label="Sair da conta">
      <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
    </button>
  </div>
</header>

<!-- Desktop: trilho lateral (recolhível) -->
<nav class="rail" [class.recolhida]="layout.recolhida()" aria-label="Principal">
  <a class="brand" routerLink="/dashboard" aria-label="Wyvern, ir para o painel">
    <span class="brand-completo">Wyvern</span>
    <span class="brand-curto" aria-hidden="true">W</span>
  </a>
  <ul class="links">
    @for (d of destinos; track d.rota) {
      <li>
        <a [routerLink]="d.rota" routerLinkActive="active" ariaCurrentWhenActive="page" [attr.title]="layout.recolhida() ? d.rotulo : null">
          <i class="bi {{ d.icone }}" aria-hidden="true"></i>
          <span>{{ d.rotulo }}</span>
        </a>
      </li>
    }
  </ul>
  <div class="rail-foot">
    <a class="rail-btn rail-perfil" routerLink="/perfil" routerLinkActive="active" ariaCurrentWhenActive="page"
       [attr.title]="layout.recolhida() ? 'Meu perfil' : null" [attr.aria-label]="layout.recolhida() ? 'Meu perfil' : null">
      <app-avatar [nome]="usuario()?.nome ?? ''" [versao]="usuario()?.fotoVersao ?? 0" [tamanho]="30" />
      <span class="rail-perfil-texto">
        <span class="rail-perfil-nome">{{ usuario()?.nome }}</span>
        <span class="rail-perfil-sub">Meu perfil</span>
      </span>
    </a>
    <button type="button" class="rail-btn" (click)="alternarTema()" [attr.title]="layout.recolhida() ? (temaAtual === 'escuro' ? 'Tema claro' : 'Tema escuro') : null">
      <i class="bi" [class.bi-sun]="temaAtual === 'escuro'" [class.bi-moon-stars]="temaAtual === 'claro'" aria-hidden="true"></i>
      <span>{{ temaAtual === 'escuro' ? 'Tema claro' : 'Tema escuro' }}</span>
    </button>
    <button type="button" class="rail-btn" (click)="logout()" [attr.title]="layout.recolhida() ? 'Sair' : null">
      <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
      <span>Sair</span>
    </button>
    <button type="button" class="rail-btn rail-toggle" (click)="layout.alternar()" [attr.aria-expanded]="!layout.recolhida()"
            [attr.aria-label]="layout.recolhida() ? 'Expandir a barra lateral' : 'Recolher a barra lateral'"
            [attr.title]="layout.recolhida() ? 'Expandir a barra lateral' : null">
      <i class="bi" [class.bi-chevron-bar-left]="!layout.recolhida()" [class.bi-chevron-bar-right]="layout.recolhida()" aria-hidden="true"></i>
      <span>Recolher</span>
    </button>
  </div>
</nav>

<!-- Celular: barra inferior -->
<nav class="bottom-nav" aria-label="Principal">
  @for (d of destinos; track d.rota) {
    <a [routerLink]="d.rota" routerLinkActive="active" ariaCurrentWhenActive="page">
      <i class="bi {{ d.icone }}" aria-hidden="true"></i>
      <span>{{ d.rotulo }}</span>
    </a>
  }
</nav>
