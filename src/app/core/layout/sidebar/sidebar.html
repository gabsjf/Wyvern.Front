<!-- App nativo fora do celular: faixa atrás da barra de status, para o conteúdo não aparecer por baixo dos ícones dela -->
<div class="faixa-status" aria-hidden="true"></div>

<!-- Celular: barra de topo com o título da tela; voltar fora das telas da barra inferior -->
<header class="mobile-bar">
  @if (raiz()) {
    <a class="brand-mini" routerLink="/dashboard" aria-label="Wyvern, ir para o painel">
      <img src="assets/images/logo-dragao.png" alt="" width="26" height="28" />
    </a>
  } @else {
    <button type="button" class="icon-btn" (click)="voltar()" aria-label="Voltar">
      <i class="bi bi-arrow-left" aria-hidden="true"></i>
    </button>
  }
  <span class="mobile-titulo">{{ titulo() }}</span>
  <a class="icon-btn perfil-mobile" routerLink="/perfil" routerLinkActive="active" ariaCurrentWhenActive="page" aria-label="Meu perfil">
    <app-avatar [nome]="usuario()?.nome ?? ''" [versao]="usuario()?.fotoVersao ?? 0" [tamanho]="32" />
  </a>
</header>

<!-- Desktop: trilho lateral (recolhível) -->
<nav class="rail" [class.recolhida]="recolhida()" [class.estreito]="estreito()" aria-label="Principal">
  <a class="brand" routerLink="/dashboard" aria-label="Wyvern, ir para o painel">
    <span class="brand-completo">Wyvern</span>
    <img class="brand-curto" src="assets/images/logo-dragao.png" alt="" width="36" height="39" />
  </a>
  <ul class="links">
    @for (d of destinos; track d.rota) {
      <li>
        <a [routerLink]="d.rota" routerLinkActive="active" ariaCurrentWhenActive="page" [attr.title]="recolhida() ? d.rotulo : null">
          <i class="bi {{ d.icone }}" aria-hidden="true"></i>
          <span>{{ d.rotulo }}</span>
        </a>
      </li>
    }
  </ul>
  <div class="rail-foot">
    <a class="rail-btn rail-perfil" routerLink="/perfil" routerLinkActive="active" ariaCurrentWhenActive="page"
       [attr.title]="recolhida() ? 'Meu perfil' : null" [attr.aria-label]="recolhida() ? 'Meu perfil' : null">
      <app-avatar [nome]="usuario()?.nome ?? ''" [versao]="usuario()?.fotoVersao ?? 0" [tamanho]="30" />
      <span class="rail-perfil-texto">
        <span class="rail-perfil-nome">{{ usuario()?.nome }}</span>
        <span class="rail-perfil-sub">Meu perfil</span>
      </span>
    </a>
    <button type="button" class="rail-btn" (click)="alternarTema()" [attr.title]="recolhida() ? (temaAtual === 'escuro' ? 'Tema claro' : 'Tema escuro') : null">
      <i class="bi" [class.bi-sun]="temaAtual === 'escuro'" [class.bi-moon-stars]="temaAtual === 'claro'" aria-hidden="true"></i>
      <span>{{ temaAtual === 'escuro' ? 'Tema claro' : 'Tema escuro' }}</span>
    </button>
    <button type="button" class="rail-btn" (click)="logout()" [attr.title]="recolhida() ? 'Sair' : null">
      <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
      <span>Sair</span>
    </button>
    @if (!estreito()) {
      <button type="button" class="rail-btn rail-toggle" (click)="layout.alternar()" [attr.aria-expanded]="!recolhida()"
              [attr.aria-label]="recolhida() ? 'Expandir a barra lateral' : 'Recolher a barra lateral'"
              [attr.title]="recolhida() ? 'Expandir a barra lateral' : null">
        <i class="bi" [class.bi-chevron-bar-left]="!recolhida()" [class.bi-chevron-bar-right]="recolhida()" aria-hidden="true"></i>
        <span>Recolher</span>
      </button>
    }
  </div>
</nav>

<!-- Celular: barra inferior (4 destinos e o "Mais") -->
<nav class="bottom-nav" aria-label="Principal">
  @for (d of destinosBarra; track d.rota) {
    <a [routerLink]="d.rota" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="tocar()">
      <i class="bi {{ d.icone }}" aria-hidden="true"></i>
      <span>{{ d.rotulo }}</span>
    </a>
  }
  <button type="button" [class.active]="maisAtivo()" (click)="tocar(); maisAberto.set(true)" aria-haspopup="dialog" [attr.aria-expanded]="maisAberto()">
    <i class="bi bi-three-dots" aria-hidden="true"></i>
    <span>Mais</span>
  </button>
</nav>

<app-bottom-sheet [aberto]="maisAberto()" (fechar)="maisAberto.set(false)" titulo="Mais">
  <ul class="mais-lista">
    <li>
      <button type="button" (click)="irPara('/perfil')">
        <app-avatar [nome]="usuario()?.nome ?? ''" [versao]="usuario()?.fotoVersao ?? 0" [tamanho]="32" />
        <span class="mais-texto"><strong>{{ usuario()?.nome }}</strong><small>Meu perfil</small></span>
        <i class="bi bi-chevron-right seta" aria-hidden="true"></i>
      </button>
    </li>
    @for (d of destinos.slice(4); track d.rota) {
      <li>
        <button type="button" (click)="irPara(d.rota)">
          <i class="bi {{ d.icone }}" aria-hidden="true"></i>
          <span class="mais-texto">{{ d.rotulo }}</span>
          <i class="bi bi-chevron-right seta" aria-hidden="true"></i>
        </button>
      </li>
    }
    <li>
      <button type="button" (click)="alternarTema()">
        <i class="bi" [class.bi-sun]="temaAtual === 'escuro'" [class.bi-moon-stars]="temaAtual === 'claro'" aria-hidden="true"></i>
        <span class="mais-texto">{{ temaAtual === 'escuro' ? 'Tema claro' : 'Tema escuro' }}</span>
      </button>
    </li>
    <li>
      <button type="button" class="perigo" (click)="logout()">
        <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
        <span class="mais-texto">Sair da conta</span>
      </button>
    </li>
  </ul>
</app-bottom-sheet>
