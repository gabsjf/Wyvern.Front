@if (totalPaginas() > 1) {
  <nav class="paginacao" aria-label="Páginas">
    <p class="paginacao-resumo" aria-live="polite">
      <span class="num">{{ primeiro() }}–{{ ultimo() }}</span> de <span class="num">{{ total() }}</span> {{ rotulo() }}
    </p>
    <ul>
      <li>
        <button type="button" class="pag-btn" (click)="ir(pagina() - 1)" [disabled]="pagina() === 1" aria-label="Página anterior">
          <i class="bi bi-chevron-left" aria-hidden="true"></i><span class="so-largo">Anterior</span>
        </button>
      </li>
      @for (item of itens(); track $index) {
        <li>
          @if (item === 'reticencias') {
            <span class="pag-reticencias" aria-hidden="true">…</span>
          } @else {
            <button type="button" class="pag-btn num" [class.atual]="item === pagina()" (click)="ir(item)"
                    [attr.aria-current]="item === pagina() ? 'page' : null" [attr.aria-label]="'Página ' + item">{{ item }}</button>
          }
        </li>
      }
      <li>
        <button type="button" class="pag-btn" (click)="ir(pagina() + 1)" [disabled]="pagina() === totalPaginas()" aria-label="Próxima página">
          <span class="so-largo">Próxima</span><i class="bi bi-chevron-right" aria-hidden="true"></i>
        </button>
      </li>
    </ul>
  </nav>
}
