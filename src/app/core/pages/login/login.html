<app-auth-shell>
  <h1 class="auth-titulo">Bem-vindo de volta</h1>
  <p class="auth-sub">Entre para continuar sua aventura.</p>

  <div *ngIf="errorMessage" class="alert-error" role="alert">{{ errorMessage }}</div>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label class="form-label" for="email">E-mail</label>
      <input id="email" type="email" class="form-control" formControlName="email" placeholder="exemplo@email.com" autocomplete="email">
      <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="text-error">E-mail inválido.</div>
    </div>

    <div class="form-group">
      <div class="auth-linha-senha">
        <label class="form-label" for="senha">Senha</label>
        <a [routerLink]="['/esqueci-senha']">Esqueci minha senha</a>
      </div>
      <input id="senha" type="password" class="form-control" formControlName="senha" placeholder="Sua senha" autocomplete="current-password">
      <div *ngIf="loginForm.get('senha')?.invalid && loginForm.get('senha')?.touched" class="text-error">Senha é obrigatória.</div>
    </div>

    <button type="submit" class="btn-primary auth-submit" [disabled]="loginForm.invalid || loading">
      <span *ngIf="!loading">Entrar</span>
      <span *ngIf="loading">Autenticando...</span>
    </button>
  </form>

  <div class="auth-footer">
    <p>Não tem uma conta? <a [routerLink]="['/register']" [queryParams]="{ returnUrl: returnUrl }">Registre-se aqui</a></p>
  </div>
</app-auth-shell>
