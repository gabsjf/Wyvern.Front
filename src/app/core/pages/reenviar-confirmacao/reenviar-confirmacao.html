<app-auth-shell>
  <h1 class="auth-titulo">Novo link de confirmação</h1>
  <p class="auth-sub">Não achou o e-mail ou o link venceu? Informe o e-mail do cadastro e enviamos outro.</p>

  <div *ngIf="errorMessage" class="alert-error" role="alert">{{ errorMessage }}</div>

  <div *ngIf="mensagemEnviado" class="alert-ok" role="status">
    <p>{{ mensagemEnviado }}</p>
    <p>O link novo substitui os anteriores. Olhe também a caixa de spam.</p>
  </div>

  <form *ngIf="!mensagemEnviado" [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label class="form-label" for="email">E-mail</label>
      <input id="email" type="email" class="form-control" formControlName="email" placeholder="exemplo@email.com" autocomplete="email">
      <div *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="text-error">E-mail inválido.</div>
    </div>

    <button type="submit" class="btn-primary auth-submit" [disabled]="form.invalid || loading">
      <span *ngIf="!loading">Enviar link</span>
      <span *ngIf="loading">Enviando...</span>
    </button>
  </form>

  <div class="auth-footer">
    <p><a [routerLink]="['/login']">&larr; Voltar para o login</a></p>
  </div>
</app-auth-shell>
