server {
    listen 80;
    server_name _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Cabeçalhos de segurança. O include se repete nas locations que têm add_header próprio, porque
    # add_header dentro de uma location descarta os do nível do server.
    include /etc/nginx/security-headers.conf;

    # SPA: qualquer rota do Angular cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos com hash no nome podem ser guardados por muito tempo.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|webp|svg|ico)$ {
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # O index.html nunca fica em cache, para o usuário sempre receber a versão nova.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    # A API é chamada direto em https://api.wyvern.sbs; não há proxy aqui.
    error_page 500 502 503 504 /50x.html;
}
